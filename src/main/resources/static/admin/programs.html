<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SlotMate 관리자 — 프로그램</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main class="container">
  <div class="admin-head">
    <h1>프로그램</h1>
    <span class="spacer"></span>
    <button class="btn primary" id="create">+ 프로그램 등록</button>
  </div>
  <div class="admin-head">
    <select id="type" style="width:auto">
      <option value="">전체 종류</option>
    </select>
    <input id="keyword" type="search" placeholder="프로그램명 검색" style="max-width:280px">
  </div>
  <div class="table-wrap">
    <table class="table">
      <thead>
      <tr><th>이름</th><th>종류</th><th>기본 시간</th><th>기본 정원</th><th>상태</th><th></th></tr>
      </thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>

<script src="/js/common.js"></script>
<script src="/js/admin-common.js"></script>
<script src="/js/admin-programs.js"></script>
</body>
</html>
