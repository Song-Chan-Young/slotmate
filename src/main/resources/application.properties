spring.application.name=slotmate

# 접속정보는 프로젝트 루트 .env 에서 읽음(.env 는 git 제외, 예시는 .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3306}/${DB_NAME:slotmate}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블은 db/init/01_schema.sql(DB 설계서 v0.2 DDL)로 만들고 JPA 는 만들지 않음
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
# BR-012 시간 기준 Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul
