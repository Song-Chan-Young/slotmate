spring.application.name=slotmate

# 접속정보는 프로젝트 루트 .env 에서 읽음(.env 는 git 제외, 예시는 .env.example)
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=jdbc:mariadb://localhost:${DB_PORT:3306}/${DB_NAME:slotmate}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# 테이블은 db/init/01_schema.sql(DB 설계서 v0.2 DDL)로 만들고 JPA 는 엔티티↔테이블 대조만 함
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
# BR-012 시간 기준 Asia/Seoul
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Seoul

# accessToken 유효시간(초) — 30일. 갱신 정책은 API 명세 12절 미정이라 우선 길게 둠
slotmate.jwt.secret=${JWT_SECRET}
slotmate.jwt.expires-in=2592000

# 기동 시 관리자·테스트 회원 계정 생성(값이 비어 있으면 안 함)
slotmate.admin.email=${ADMIN_EMAIL:}
slotmate.admin.password=${ADMIN_PASSWORD:}
slotmate.member.email=${MEMBER_EMAIL:}
slotmate.member.password=${MEMBER_PASSWORD:}
