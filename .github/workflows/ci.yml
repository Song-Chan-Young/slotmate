# push·PR 마다 실제 MariaDB 에 붙여 전체 테스트 실행 + Docker 이미지 빌드 확인
# DB 계정·비밀번호는 이 job 안에서만 쓰고 버리는 컨테이너용 값. JWT 키는 실행마다 새로 만듦
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: slotmate
          MARIADB_USER: slotmate
          MARIADB_PASSWORD: ci-only
          MARIADB_ROOT_PASSWORD: ci-only-root
          TZ: Asia/Seoul
        ports: ["3306:3306"]
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DB_NAME: slotmate
      DB_PORT: 3306
      DB_USERNAME: slotmate
      DB_PASSWORD: ci-only
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-pass
      MEMBER_EMAIL: member@ci.local
      MEMBER_PASSWORD: ci-member-pass
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: 스키마 적용 (db/init/01_schema.sql)
        run: |
          docker exec -i ${{ job.services.mariadb.id }} mariadb -uslotmate -pci-only slotmate < db/init/01_schema.sql
      - name: JWT 키 생성
        run: echo "JWT_SECRET=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
      - name: 테스트
        run: ./gradlew test
      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/test-results/test/

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 이미지 빌드
        run: docker build -t slotmate-app:ci .
