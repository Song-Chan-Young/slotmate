# 로컬 개발용 MariaDB. 값은 .env 에서 읽음(.env.example 복사해 만듦)
services:
  mariadb:
    image: mariadb:11.4
    container_name: slotmate-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-slotmate}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - slotmate-db:/var/lib/mysql
      # 볼륨이 비어 있을 때(최초 기동)만 실행됨
      - ./db/init:/docker-entrypoint-initdb.d:ro

volumes:
  slotmate-db:
