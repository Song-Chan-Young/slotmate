# 로컬 개발용 MariaDB. 값은 .env 에서 읽음(.env.example 복사해 만듦)
services:
  mariadb:
    image: mariadb:11.4
    container_name: slotmate-mariadb
    environment:
      MARIADB_DATABASE: ${DB_NAME:-slotmate}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+09:00
    ports:
      - "${DB_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - slotmate-db:/var/lib/mysql
      # 볼륨이 비어 있을 때(최초 기동)만 실행됨
      - ./db/init:/docker-entrypoint-initdb.d:ro

  # 앱 컨테이너 — 개발 중에는 안 뜸. 서버에서는 docker compose --profile app up -d --build
  app:
    profiles: ["app"]
    build: .
    container_name: slotmate-app
    env_file: .env
    environment:
      SPRING_DATASOURCE_URL: jdbc:mariadb://mariadb:3306/${DB_NAME:-slotmate}
    ports:
      - "${APP_PORT:-8080}:8080"
    depends_on:
      mariadb:
        condition: service_healthy
    restart: unless-stopped

volumes:
  slotmate-db:
